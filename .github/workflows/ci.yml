name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  ci:
    uses: Volontariapp/ci-tools/.github/workflows/runner-pipeline.yml@main
    permissions:
      contents: read
      packages: write
    with:
      service-name: workers-runners
      services: '["worker-user", "worker-event", "worker-post", "worker-social", "worker-storage", "worker-ranking"]'
    secrets: inherit

  notify-ready:
    needs: [ci]
    # `needs:` implies success(): without !failure() a skipped job would skip the notification.
    if: ${{ !failure() && !cancelled() && github.event_name == 'pull_request' }}
    # A reusable workflow cannot raise the permissions of its caller.
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: Volontariapp/ci-tools/.github/workflows/pr-ready-notify.yml@main
    with:
      channel: backend
    secrets:
      DISCORD_WEBHOOK_BACKEND: ${{ secrets.DISCORD_WEBHOOK_BACKEND }}
      DISCORD_WEBHOOK_FRONTEND: ${{ secrets.DISCORD_WEBHOOK_FRONTEND }}
      ORG_REPO_TOKEN: ${{ secrets.ORG_REPO_TOKEN }}
